{% extends "base.html" %}
{% block content %}
<h1>Вход</h1>
<form method="POST" action="/login">
    <label>Логин
        <input type="text" name="login" data-testid="login-login" required>
    </label>
    <label>Пароль
        <input type="password" name="password" data-testid="login-password" required>
    </label>
    <button type="submit" data-testid="login-submit">Войти</button>
</form>

{% if error %}<p style="color:red">{{ error }}</p>{% endif %}

<p><a href="/register">Еще не зарегистрированы? Регистрация</a></p>
{% endblock %}
