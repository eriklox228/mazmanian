{% extends "base.html" %}
{% block content %}
<h1>Регистрация</h1>
<form method="POST" action="/register">
    <label>Логин
        <input type="text" name="login" data-testid="reg-login" required>
    </label>
    <label>Пароль
        <input type="password" name="password" data-testid="reg-password" required>
    </label>
    <label>ФИО
        <input type="text" name="fullname" data-testid="reg-fullname" required>
    </label>
    <label>Телефон
        <input type="text" name="phone" data-testid="reg-phone" placeholder="8(XXX)XXX-XX-XX" required>
    </label>
    <label>E-mail
        <input type="email" name="email" data-testid="reg-email" required>
    </label>
    <button type="submit" data-testid="reg-submit">Создать пользователя</button>
</form>

{% if error %}<p style="color:red">{{ error }}</p>{% endif %}

<p><a href="/login">Уже зарегистрированы? Войти</a></p>
{% endblock %}
