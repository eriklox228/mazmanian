{% extends "base.html" %}
{% block content %}
<h1>Панель администратора</h1>
<table>
    <tr><th>ID</th><th>Пользователь</th><th>Помещение</th><th>Дата</th><th>Оплата</th><th>Статус</th></tr>
    {% for r in requests %}
    <tr data-testid="admin-row">
        <td>{{ r.id }}</td>
        <td>{{ r.user.login }}</td>
        <td>{{ r.room }}</td>
        <td>{{ r.start_date }}</td>
        <td>{{ r.payment }}</td>
        <td>
            <form method="POST" action="/update_status/{{ r.id }}">
                <select name="status" data-testid="admin-status">
                    <option {% if r.status=='Новая' %}selected{% endif %}>Новая</option>
                    <option {% if r.status=='Мероприятие назначено' %}selected{% endif %}>Мероприятие назначено</option>
                    <option {% if r.status=='Завершено' %}selected{% endif %}>Завершено</option>
                </select>
                <button type="submit">ОК</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
